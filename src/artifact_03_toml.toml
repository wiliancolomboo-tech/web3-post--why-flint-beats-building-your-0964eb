[toolchain]
anchor_version = "0.30.1"
solana_version = "1.18.17"

[features]
seeds = true
skip-lint = false

[programs.localnet]
flint_engine = "FL1NTqX8v2Uf2Z5aXz5nC7N8CqU7CjC4d6W2d7z7k8b"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"