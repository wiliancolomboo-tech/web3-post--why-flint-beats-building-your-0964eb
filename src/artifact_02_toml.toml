[package]
name = "flint-amm"
version = "0.1.0"
description = "High-efficiency modular dynamic-fee AMM engine powered by Flint primitives"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "flint_amm"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "token_2022"] }
bytemuck = { version = "1.16.1", features = ["derive", "min_const_generics"] }
solana-program = "1.18.26"
thiserror = "1.0.63"